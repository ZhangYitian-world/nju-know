name: Verify candidate WeChat sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 准备固定版本元数据采集器
        run: |
          python -m pip install -r requirements-wechat.txt cryptography==50.0.2
          mkdir -p .local/wechat-collector
          git -C .local/wechat-collector init
          git -C .local/wechat-collector remote add origin https://github.com/x554960766/wechatAutoRSSTool.git
          git -C .local/wechat-collector fetch --depth 1 origin 1b24c1d388ab3ff0262cbb7ada5533f23c7b4689
          git -C .local/wechat-collector checkout --detach FETCH_HEAD
      - name: 恢复加密授权
        uses: actions/cache@v4
        with:
          path: .local/wechat-auth.enc
          key: wechat-auth-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wechat-auth-v1-
      - name: 仅验证候选来源，不发布网站
        env:
          WECHAT_CLOUD_AUTH: ${{ secrets.WECHAT_CLOUD_AUTH }}
        run: |
          cp wechat_candidates.json wechat_sources.json
          # Only remove public fixtures from this disposable runner checkout.
          rm -f data/wechat_health_seed.json data/wechat_source_status.json data/wechat.json
          python collect_wechat_cloud.py
      - name: 保存公开验证结果
        uses: actions/upload-artifact@v4
        with:
          name: wechat-candidate-results
          path: |
            data/wechat_source_status.json
            data/wechat_run_status.json
          if-no-files-found: error
          retention-days: 7
