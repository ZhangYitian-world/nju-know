name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      review_id:
        description: "一次性分类复核批次（留空为普通更新，同一批次可续跑）"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 准备复核检查依赖
        if: inputs.review_id != ''
        run: python -m pip install cryptography==50.0.2
      - name: 准备云端公众号采集器
        if: vars.WECHAT_PROVIDER == 'cloud' && inputs.review_id == ''
        run: |
          python -m pip install -r requirements-wechat.txt cryptography==50.0.2
          mkdir -p .local/wechat-collector
          git -C .local/wechat-collector init
          git -C .local/wechat-collector remote add origin https://github.com/x554960766/wechatAutoRSSTool.git
          git -C .local/wechat-collector fetch --depth 1 origin 1b24c1d388ab3ff0262cbb7ada5533f23c7b4689
          git -C .local/wechat-collector checkout --detach FETCH_HEAD
      - name: 恢复云端公众号公开数据
        if: vars.WECHAT_PROVIDER == 'cloud'
        uses: actions/cache@v4
        with:
          path: |
            data/wechat.json
            data/wechat_source_status.json
          key: wechat-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wechat-public-v1-
      - name: 恢复加密的公众号授权状态
        if: vars.WECHAT_PROVIDER == 'cloud' && inputs.review_id == ''
        uses: actions/cache@v4
        with:
          path: .local/wechat-auth.enc
          key: wechat-auth-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wechat-auth-v1-
      - name: 云端采集公众号（不依赖本机开机）
        if: vars.WECHAT_PROVIDER == 'cloud' && inputs.review_id == ''
        env:
          WECHAT_CLOUD_AUTH: ${{ secrets.WECHAT_CLOUD_AUTH }}
        run: python collect_wechat_cloud.py
      - name: 准备公众号数据（本机同步或远程 API/RSS）
        if: inputs.review_id == ''
        env:
          WECHAT_PROVIDER: ${{ vars.WECHAT_PROVIDER }}
          WERSS_AK: ${{ secrets.WERSS_AK }}
          WERSS_SK: ${{ secrets.WERSS_SK }}
          WECHAT_LIMIT: "60"
        run: python fetch_wechat.py
      - name: 恢复官网数据缓存
        uses: actions/cache@v4
        with:
          path: |
            data/notices.json
            data/source_status.json
          key: official-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-notices-v1-
      - name: 验证抓取、模型适配与缓存回退
        run: python -m unittest discover -s tests -v -b
      - name: 抓取官网通知
        if: inputs.review_id == ''
        run: python scraper.py
      - name: 恢复分类结果缓存
        uses: actions/cache@v4
        with:
          path: data/llm.json
          key: article-classification-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: article-classification-v3-
      - name: 恢复同批次复核进度
        if: inputs.review_id != ''
        uses: actions/cache@v4
        with:
          path: data/classification_review.json
          key: classification-review-v1-${{ inputs.review_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: classification-review-v1-${{ inputs.review_id }}-
      - name: 可选模型分类（无密钥时使用规则）
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLASSIFIER_PROVIDER: ${{ inputs.review_id != '' && 'deepseek' || vars.CLASSIFIER_PROVIDER }}
          ENRICH_REVIEW_ID: ${{ inputs.review_id }}
          ENRICH_MAX_ITEMS: ${{ inputs.review_id != '' && '800' || '100' }}
          ENRICH_MAX_SECONDS: ${{ inputs.review_id != '' && '600' || '120' }}
        run: python enrich_llm.py
      - name: 保存公开分类复核报告
        if: inputs.review_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: classification-review
          path: data/classification_review.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 验证分类与重复合并
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: 构建新版静态站点
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
