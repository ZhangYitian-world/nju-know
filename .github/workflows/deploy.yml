name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 准备公众号数据（本机同步或远程 API/RSS）
        env:
          WECHAT_PROVIDER: ${{ vars.WECHAT_PROVIDER }}
          WERSS_AK: ${{ secrets.WERSS_AK }}
          WERSS_SK: ${{ secrets.WERSS_SK }}
          WECHAT_LIMIT: "60"
        run: python fetch_wechat.py
      - name: 恢复官网数据缓存
        uses: actions/cache@v4
        with:
          path: |
            data/notices.json
            data/source_status.json
          key: official-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: official-notices-v1-
      - name: 验证抓取、模型适配与缓存回退
        run: python -m unittest discover -s tests -v -b
      - name: 抓取官网通知
        run: python scraper.py
      - name: 恢复分类结果缓存
        uses: actions/cache@v4
        with:
          path: data/llm.json
          key: article-classification-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: article-classification-v3-
      - name: 可选模型分类（无密钥时使用规则）
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLASSIFIER_PROVIDER: ${{ vars.CLASSIFIER_PROVIDER }}
          ENRICH_MAX_ITEMS: "100"
        run: python enrich_llm.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 验证分类与重复合并
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: 构建新版静态站点
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
