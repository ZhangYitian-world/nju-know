name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 抓取公众号（有密钥走 API，无则退回 RSS）
        env:
          WERSS_AK: ${{ secrets.WERSS_AK }}
          WERSS_SK: ${{ secrets.WERSS_SK }}
          WECHAT_LIMIT: "60"
        run: python fetch_wechat.py
      - name: 抓取官网通知
        run: python scraper.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 构建新版静态站点
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
